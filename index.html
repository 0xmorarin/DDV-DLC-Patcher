<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090c25">
<title>DDV DLC Patcher</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="sky-haze" aria-hidden="true"></div>
<div id="global-drop-overlay" class="global-drop-overlay hidden" aria-hidden="true"><div class="global-drop-prompt">Drop profile here</div></div>
<main class="page-shell">
<section id="workspace-card" class="card unified-card">
<div class="title-row">
<div class="brand">

<p class="eyebrow">Disney Dreamlight Valley</p>
<h1>DDV DLC Patcher</h1>
</div>
<div class="support-badge">v1.26.1+</div>
</div>
<div class="simple-divider" aria-hidden="true"></div>
<div class="supported-row">
<span class="section-label">Supported DLCs</span>
<ul id="dlc-list" class="dlc-list"></ul>
</div>
<div id="upload-state" class="upload-state" tabindex="0" role="button" aria-label="Drop or choose a DDV profile">
<div class="drop-symbol" aria-hidden="true">
<svg viewBox="0 0 64 64" fill="none">
<path d="M32 12v26" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
<path d="M24 30l8 8 8-8" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M14 42v10h36V42" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
</div>
<h2>Drop profile here</h2>
<button id="choose-file" class="button secondary" type="button"><span>Choose File</span><svg viewBox="0 0 20 20" aria-hidden="true" fill="none"><path d="M4 10h11 M10 5l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<input id="file-input" type="file" hidden>
</div>
<div id="profile-state" class="profile-state hidden">
<div id="auto-patch-progress" class="auto-patch-progress hidden" role="status" aria-live="polite"><span class="processing-orb" aria-hidden="true"></span>Processing…</div>
<div id="patch-result" class="patch-result hidden" role="status" aria-live="polite">
<h2 id="result-title">Patched</h2>
<p id="result-note" class="result-note"></p>
<button id="download-again" class="button secondary compact hidden" type="button">Download Again</button>
</div>
<div id="inline-error" class="inline-error hidden" role="alert"><div class="status-mark error-mark" aria-hidden="true">!</div><h2 id="error-title">Invalid file</h2><p id="error-message"></p></div>
<button id="reset-file" class="button ghost compact reset-file" type="button">Choose another file</button>
</div>
<p class="offline-note">Offline only · Online checks may reset changes</p>
</section>
</main>
<script type="module" src="./js/app.js"></script>
</body>
</html>
