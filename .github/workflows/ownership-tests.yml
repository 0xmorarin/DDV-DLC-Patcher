name: DLC ownership regression tests

on:
  pull_request:
    paths:
      - "js/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/ownership-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test ownership contracts
        run: npm test
