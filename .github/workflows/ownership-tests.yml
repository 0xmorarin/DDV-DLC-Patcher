name: DLC ownership regression tests

on:
  pull_request:
    paths:
      - "js/**"
      - "assets/**"
      - "index.html"
      - "style.css"
      - "tests/**"
      - "tools/**"
      - "package.json"
      - "docs/**"
      - ".github/workflows/ownership-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test ownership contracts
        run: npm test

  browser:
    needs: ownership
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium browser test dependency
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
      - name: Test browser download and no-op contracts
        run: node tests/browser-e2e.mjs
      - name: Package source for local regression verification
        uses: actions/upload-artifact@v4
        with:
          name: ddv-patcher-local-source
          path: |
            js/
            assets/
            ui-preview/
            tests/
            tools/
            index.html
            style.css
            preview-local.cmd
            package.json
          if-no-files-found: error
          retention-days: 3
