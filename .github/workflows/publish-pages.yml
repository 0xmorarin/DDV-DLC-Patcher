name: Publish DDV DLC Patcher to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ddv-patcher-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate production source manifest
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git ls-files | grep -Ev '^(index\.html|style\.css|\.github/workflows/publish-pages\.yml|js/[^/]+\.js|assets/[^/]+\.svg)        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html style.css dist/
          cp -R js assets dist/
          touch dist/.nojekyll
          test -s dist/index.html
          test -s dist/js/app.js
          test -s dist/assets/royal-nebula.svg
          if grep -R -n -E 'https?://' dist/index.html dist/js dist/style.css; then
            echo "Unexpected external URL in public runtime" >&2
            exit 1
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload public site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live public page
        shell: bash
        env:
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PUBLIC_URL%/}"
          for attempt in {1..15}; do
            if curl --fail --location --silent --show-error --max-time 12 "$base/" -o /tmp/ddv_public.html \
              && grep -Fq 'class="simple-divider"' /tmp/ddv_public.html \
              && grep -Fq 'v1.26.1+' /tmp/ddv_public.html \
              && ! grep -Fq 'id="status-mark"' /tmp/ddv_public.html \
              && curl --fail --location --silent --show-error --max-time 12 "$base/style.css" -o /tmp/ddv_public.css \
              && grep -Fq 'royal-nebula.svg' /tmp/ddv_public.css \
              && curl --fail --location --silent --show-error --max-time 12 "$base/assets/royal-nebula.svg" -o /tmp/ddv_public.svg \
              && grep -Fq '<svg' /tmp/ddv_public.svg \
              && curl --fail --location --silent --show-error --max-time 12 "$base/js/config.js" -o /tmp/ddv_public_config.js \
              && grep -Fq 'MIN_SUPPORTED_PROFILE_VERSION = 591' /tmp/ddv_public_config.js \
              && grep -Fq 'FIVE_DLC_MIN_PROFILE_VERSION = 643' /tmp/ddv_public_config.js; then
              echo "PUBLIC LIVE SMOKE PASS: $base/ (v1.26.1+ UI; four/five DLC policy)"
              exit 0
            fi
            sleep 5
          done
          echo "PUBLIC LIVE SMOKE FAILED: $base/" >&2
          exit 1
 || true)"
          if [ -n "$unexpected" ]; then
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          for source in js/*.js; do
            node --check "$source"
          done
          if grep -nE '/\*|\*/|<!--|-->|^[[:space:]]*//' index.html style.css js/*.js assets/*.svg; then
            echo "Source comments are not permitted" >&2
            exit 1
          fi
          if grep -nE '^[[:space:]]*#' .github/workflows/publish-pages.yml; then
            echo "Workflow comments are not permitted" >&2
            exit 1
          fi
      - name: Assemble public static app only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html style.css dist/
          cp -R js assets dist/
          touch dist/.nojekyll
          test -s dist/index.html
          test -s dist/js/app.js
          test -s dist/assets/royal-nebula.svg
          if grep -R -n -E 'https?://' dist/index.html dist/js dist/style.css; then
            echo "Unexpected external URL in public runtime" >&2
            exit 1
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload public site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live public page
        shell: bash
        env:
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PUBLIC_URL%/}"
          for attempt in {1..15}; do
            if curl --fail --location --silent --show-error --max-time 12 "$base/" -o /tmp/ddv_public.html \
              && grep -Fq 'class="simple-divider"' /tmp/ddv_public.html \
              && grep -Fq 'v1.26.1+' /tmp/ddv_public.html \
              && ! grep -Fq 'id="status-mark"' /tmp/ddv_public.html \
              && curl --fail --location --silent --show-error --max-time 12 "$base/style.css" -o /tmp/ddv_public.css \
              && grep -Fq 'royal-nebula.svg' /tmp/ddv_public.css \
              && curl --fail --location --silent --show-error --max-time 12 "$base/assets/royal-nebula.svg" -o /tmp/ddv_public.svg \
              && grep -Fq '<svg' /tmp/ddv_public.svg \
              && curl --fail --location --silent --show-error --max-time 12 "$base/js/config.js" -o /tmp/ddv_public_config.js \
              && grep -Fq 'MIN_SUPPORTED_PROFILE_VERSION = 591' /tmp/ddv_public_config.js \
              && grep -Fq 'FIVE_DLC_MIN_PROFILE_VERSION = 643' /tmp/ddv_public_config.js; then
              echo "PUBLIC LIVE SMOKE PASS: $base/ (v1.26.1+ UI; four/five DLC policy)"
              exit 0
            fi
            sleep 5
          done
          echo "PUBLIC LIVE SMOKE FAILED: $base/" >&2
          exit 1
